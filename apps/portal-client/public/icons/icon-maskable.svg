<!--
  A versão que o Android recorta na forma do sistema (círculo, gota, quadrado).

  Mesma marca e mesmo fundo do ícone normal, com duas diferenças que o recorte
  exige: o fundo vai até a borda, sem raio, e a marca é menor — 36% da largura
  em vez de 43,5% —, para caber inteira na zona segura mesmo no recorte
  circular.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#020e18"/>
  <g transform="translate(166.34 145.49) scale(0.84940)" fill="#1b9abd">
    <path d="M109 0 L217 219 L160 219 L81 58 Z"/>
    <path d="M48 119 L82 119 L112 183 L74.7 183 L58 219 L0 219 Z"/>
  </g>
</svg>
